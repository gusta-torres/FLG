[project]
name = "flg-content-system"
version = "0.1.0"
description = "Sistema Operacional de Criação de Conteúdo baseado em Founder-Led Growth (FLG)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "openai>=1.54",
    "anthropic>=0.39",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
